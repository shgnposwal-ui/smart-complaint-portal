spring.application.name=smart-complaint-portal

# ===============================
# MySQL Configuration
# ===============================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/smart_complaint_db}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Mysql2@26}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# Server
# ===============================

server.port=${PORT:8080}


# ===============================
# JWT Configuration
# ===============================

jwt.secret=${JWT_SECRET:ThisIsMyVerySecureSecretKeyForSmartComplaintPortalProject2026}
jwt.expiration=${JWT_EXPIRATION:86400000}